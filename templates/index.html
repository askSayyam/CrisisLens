<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrisLens | Multilingual Fact-Check</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Background Animated Gradients -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <div class="container">
        <header>
            <div class="logo">
                <span class="logo-icon">🔍</span>
                <h1>CrisLens</h1>
            </div>
            <p class="subtitle">SemEval Task 7: Multilingual Fact-Check Post Retrieval</p>
        </header>

        <main>
            <div class="search-box glass">
                <div class="mode-toggle">
                    <button class="toggle-btn active" data-mode="cross">🌍 Crosslingual</button>
                    <button class="toggle-btn" data-mode="mono">📝 Monolingual</button>
                </div>
                
                <div class="input-wrapper">
                    <input type="text" id="searchInput" placeholder="Paste a social media post to fact-check..." autocomplete="off">
                    <button id="searchBtn">
                        <span>Search</span>
                        <div class="loader hidden"></div>
                    </button>
                </div>
            </div>

            <div id="resultsContainer" class="results-container">
                <!-- Search results will be dynamically injected here -->
                <div class="placeholder-state">
                    <p>Enter a query to search the fact-check database.</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
